name: Demo verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -c catalog/constraints.txt -e './catalog[dev]'
      - run: pytest -q
        working-directory: catalog
  publisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: publisher/package-lock.json
      - run: npm ci
        working-directory: publisher
      - run: npm test && npm run build && npm run lint
        working-directory: publisher
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/integration_test.py
      - name: Build and validate production proxy
        run: |
          docker build -f deploy/proxy.Dockerfile --build-arg VITE_CENTRAL_CATALOG_URL=https://catalog.example.org/catalog --build-arg VITE_DEFAULT_IDP=https://issuer.example.org -t demo-proxy .
          docker run --rm -e CATALOG_HOST=catalog.example.org -e PUBLISHER_HOST=publisher.example.org -e ACME_EMAIL=test@example.org demo-proxy caddy validate --config /etc/caddy/Caddyfile
          docker compose --env-file .env.example config --no-env-resolution --quiet
